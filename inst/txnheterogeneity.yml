# Build this environment as x86_64. On Apple Silicon the default osx-arm64
# subdir cannot satisfy the pins below — conda-forge and bioconda have thin
# arm64 coverage for several of these (r-ggpointdensity has one arm64 build,
# eighteen for osx-64), and the solver reports the shortfall as "package does
# not exist", which is misleading.
#
#   CONDA_SUBDIR=osx-64 mamba env create -f inst/txnheterogeneity.yml
#   conda activate txnheterogeneity
#   conda config --env --set subdir osx-64   # keep later installs x86_64
#
# On Linux, create it normally.
name: txnheterogeneity
channels:
  - conda-forge
  - defaults
  - bioconda
dependencies:
  - python
  - ipykernel
  - jupyter
  - jupyterlab
  - jupyterlab-lsp
  - jupyter-lsp-python
  - jupyter-lsp-r
  - nomkl
  - jupyter_contrib_nbextensions
  - macs2
  - h5py
  - numpy
  - pandas
  - nexusformat
  - pytables
  - scipy
  - scanpy
  - tqdm
  - seaborn
  - matplotlib
  - r-base
  - r-essentials
  - r-ggplot2
  - r-stringr
  - r-tidyr
  - r-ggpointdensity
  - r-dplyr
  - r-ggpubr
  - r-ggrepel
  - r-seurat=5.3.0
  - r-matrix
  - r-gridextra
  - r-viridis
  - r-archr=1.0.3
  - r-signac
  - bioconductor-qvalue
  - r-ggforce
  - r-pbapply
  - bioconductor-sparsematrixstats
  - bioconductor-complexheatmap
  - bioconductor-bsgenome.hsapiens.ucsc.hg38
  - bioconductor-genomation
  - pip
  # cvequality is installed from CRAN, not conda: the conda build pins
  # r-base >=3.6,<3.7, which is incompatible with the r-seurat and r-archr
  # versions pinned above and makes this environment unsolvable.
  #   install.packages("cvequality", repos = "https://cloud.r-project.org")
